name: Bug
description: Something that does not work as documented or expected.
title: "fix(<scope>): <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use the commit format for the title, e.g. `fix(availability): fixes slots offered outside opening hours`.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Area of the system affected (same scopes as in CONTRIBUTING.md).
      options:
        - restaurant
        - floorplan
        - availability
        - booking
        - customer
        - verification
        - notification
        - auth
        - audit
        - db
        - api
        - ui
        - docs
        - Several areas / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the wrong behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Error messages, stack traces, API responses. Remove passwords, tokens and personal data.
      render: text
    validations:
      required: false
  - type: input
    id: refs
    attributes:
      label: Documentation references
      description: Requirement and rule IDs from docs/business-rules.md, or ADRs, that this relates to.
      placeholder: "FR-04, BR-02, ADR-0002"
    validations:
      required: false
